<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kanban</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Destaque</h1>
    </header>
    <main>
      <section>
        <table>
          <thead>
            <tr>
              <th><h3>Dia a Dia</h3></th>
              <th><h3>Metas</h3></th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td>Estudar</td>
              <td>2 horas</td>
              <td><button type="one">✔️</button></td>
            </tr>
            <tr>
              <td>Praticar</td>
              <td>1 horas</td>
              <td><button type="two">✔️</button></td>
            </tr>
            <tr>
              <td>Melhorar</td>
              <td>30 minutos</td>
              <td><button type="tree">✔️</button></td>
            </tr>
            <tr>
              <td>Revisar</td>
              <td>10 minuntos</td>
              <td><button type="four">✔️</button></td>
            </tr>
            <tr>
              <td>Concluir</td>
              <td>15 minutos</td>
              <td><button type="five">✔️</button></td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>

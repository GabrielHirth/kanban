<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Lista de Tarefas</h1>
    </header>
    <main>
      <section>
        <div class="add-task">
          <input
            type="text"
            id="task-input"
            placeholder="Digite uma tarefa..."
            maxlength="100"
          />
          <button id="add-btn" type="button">Adicionar</button>
        </div>
        <table>
          <thead>
            <tr>
              <th><h3>Tarefa</h3></th>
              <th><h3>Concluir</h3></th>
            </tr>
          </thead>
          <tbody id="task-list">
            <tr id="empty-message">
              <td colspan="2">Nenhuma tarefa cadastrada.</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
